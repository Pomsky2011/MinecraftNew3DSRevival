// The ownership mod (DESIGN.md §3.1). Its logic is Rust, compiled to JVM bytecode by cargo-jvm
// (§3.1.1); the Rust's classes go into this jar before Loom remaps it, so remapJar translates
// their references to Minecraft's classes along with the Java's.

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// For the client command and the title-screen hook.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Optional: with it, the config screen shows in its list; the dev client has it.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

def rustDir = file('rust')
def rustJar = layout.buildDirectory.file('rust/n3dsr-export-rust.jar')

// `cargo jvm package --lib` writes a self-contained jar: our classes and the runtime they need.
def cargoJvm = tasks.register('cargoJvm', Exec) {
	workingDir rustDir
	inputs.dir(rustDir.toPath().resolve('src'))
	inputs.file(rustDir.toPath().resolve('Cargo.toml'))
	outputs.file(rustJar)
	commandLine 'cargo', 'jvm', 'package', '--release', '--lib', '--output', rustJar.get().asFile.path
}

dependencies {
	// For javac: the Rust's classes, which the Java calls.
	implementation files(rustJar).builtBy(cargoJvm)
}

jar {
	dependsOn cargoJvm
	from(zipTree(rustJar)) {
		exclude 'META-INF/**'
	}
	from('../LICENSE')
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Parity vectors (DESIGN.md §11.2): development-only programs that run the game's own code on the
// player's files. Never part of the mod's jar.
sourceSets {
	vectors {
		java.srcDir 'src/vectors/java'
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
}

tasks.register('mipmapVectors', JavaExec) {
	group = 'verification'
	description = "Writes vanilla's mip levels for crates/assets/tests/mipmap_vanilla.rs."
	classpath = sourceSets.vectors.runtimeClasspath
	mainClass = 'io.github.pomsky2011.n3dsr.vectors.MipmapVectors'
	def proof = "${System.getProperty('user.home')}/.config/n3dsr/proofs/${project.minecraft_version}.json"
	args proof, file("../assets/${project.minecraft_version}/vectors/mipmap").path
}

tasks.register('blockModelVectors', JavaExec) {
	group = 'verification'
	description = "Writes vanilla's baked block models for crates/assets/tests/bake_vanilla.rs."
	classpath = sourceSets.vectors.runtimeClasspath
	mainClass = 'io.github.pomsky2011.n3dsr.vectors.BlockModelVectors'
	def proof = "${System.getProperty('user.home')}/.config/n3dsr/proofs/${project.minecraft_version}.json"
	def out = file("../assets/${project.minecraft_version}/vectors/block_models.txt")
	doFirst { out.parentFile.mkdirs() }
	args proof, out.path
}

tasks.register('itemModelVectors', JavaExec) {
	group = 'verification'
	description = "Writes vanilla's baked item models for crates/assets/tests/bake_items_vanilla.rs."
	classpath = sourceSets.vectors.runtimeClasspath
	mainClass = 'io.github.pomsky2011.n3dsr.vectors.ItemModelVectors'
	def proof = "${System.getProperty('user.home')}/.config/n3dsr/proofs/${project.minecraft_version}.json"
	def out = file("../assets/${project.minecraft_version}/vectors/item_models.txt")
	doFirst { out.parentFile.mkdirs() }
	args proof, out.path
}
