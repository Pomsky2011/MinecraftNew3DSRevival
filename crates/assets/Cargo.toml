[package]
name = "n3dsr-assets"
description = "Resource packs and asset conversion, as Java takes them; run by n3dsr-build on the PC and by the 3DS app for packs added later"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Everything here also runs on the 3DS (DESIGN.md §3.5): pure Rust only.
[dependencies]
png = "0.18"
regex = "1"
serde = { version = "1", features = ["derive"] }
# arbitrary_precision keeps a number's text, so floats parse straight to f32 as Gson does.
serde_json = { version = "1", features = ["arbitrary_precision"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

# One feature per build base, as n3dsr-core (DESIGN.md §5.6); build.rs checks exactly one is on.
[features]
default = ["mc1_21_11"]
mc1_21_11 = []
