[package]
name = "n3dsr-build"
description = "Signs in, checks ownership, downloads Minecraft: Java Edition and converts it for the 3DS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
n3dsr-assets = { path = "../assets" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
